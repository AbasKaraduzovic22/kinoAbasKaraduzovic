<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sala – Kino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="..\css\stil.css"/>
  <link rel="stylesheet" href="..\css\sala.css"/>
</head>
<body>

  <nav>
    <div class="nav-logo">
      <img src="../slike/icon_192.png" alt="Logo"/>
    </div>
    <span class="nav-title">SALA</span>
    <ul>
      <li><a href="filmovi.html">Filmovi</a></li>
      <li><a href="raspored.html">Raspored</a></li>
      <li><a href="sala.html" class="trenutno">Sala</a></li>
    </ul>
  </nav>

  <main>
    <div class="sala-box">

      <div class="film-panel">
        <div class="film-card-sala trenutno">
          <img class="film-poster-sala" id="film-poster" src="https://via.placeholder.com/200x300/999/fff?text=Poster" alt="Film poster"/>
          <div class="film-info-sala">
            <div class="title" id="naziv-filma">–</div>
            <div class="duration" id="trajanje">–</div>
          </div>
        </div>
        <div class="film-meta">
          <div class="meta-item"><span class="meta-label">Vrijeme</span><span class="meta-value" id="vrijeme">–</span></div>
          <div class="meta-item"><span class="meta-label">Sala</span><span class="meta-value" id="sala-naziv">–</span></div>
        </div>
      </div>

      <div class="sredina">
        <div class="platno">PLATNO</div>
        <div id="sala"></div>
      </div>

      <div class="legenda">
        <div class="legenda-item"><div class="legenda-boja zauzeto">1</div><span>Zauzeto</span></div>
        <div class="legenda-item"><div class="legenda-boja slobodno">1</div><span>Slobodno</span></div>
        <div class="legenda-item"><div class="legenda-boja rezervisano">1</div><span>Rezervisano</span></div>
      </div>

    </div>
    <div class="navigacija">
    <button class="nav-btn" id="btn-prethodna">◀ Prethodna projekcija</button>
    <button class="nav-btn" id="btn-sljedeca">Sljedeća projekcija ▶</button>
  </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const film     = params.get('film');
    const vrijeme  = params.get('vrijeme');
    const sala     = params.get('sala');
    const poster   = params.get('poster');
    const trajanje = params.get('trajanje');

    if (film)     document.getElementById('naziv-filma').textContent = film;
    if (vrijeme)  document.getElementById('vrijeme').textContent     = vrijeme;
    if (sala)     document.getElementById('sala-naziv').textContent  = sala;
    if (trajanje) document.getElementById('trajanje').textContent    = trajanje;
    if (poster)   document.getElementById('film-poster').src         = poster;
    if (film)     document.title = 'Sala – ' + film;
  </script>
<script src="../scripts/app.js"></script>
<script src="../scripts/kinoSala.js"></script>
</body>
</html>
